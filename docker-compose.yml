# Commit
#
#   Desarrollo:  docker compose --profile dev up --build
#   Producción:  docker compose --profile prod up --build -d
#
# Postgres y Redis corren en ambos perfiles. Variables en .env (ver .env.example).

name: finanzas

x-backend-env: &backend-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  JWT_SECRET: ${JWT_SECRET:?definí JWT_SECRET en .env}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
  PORT: 3000

services:
  # ── Infraestructura ──────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql # PG18: el volumen va en el directorio padre
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # ── Desarrollo ───────────────────────────────────────────────
  backend-dev:
    profiles: [dev]
    build:
      context: ./backend
      target: dev
    environment:
      <<: *backend-env
      NODE_ENV: development
      # Solo en desarrollo: los e2e registran muchas cuentas por minuto (producción usa 10).
      AUTH_RATE_LIMIT: 200
      CORS_ORIGINS: http://localhost:4200
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
      # salida propia del contenedor (.dist-dev): ni el host ni el contenedor se pisan el build
      - backend-dist:/app/.dist-dev
    ports:
      - "3000:3000"
      - "9229:9229"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend-dev:
    profiles: [dev]
    build:
      context: ./frontend
      target: dev
    environment:
      API_PROXY_TARGET: http://backend-dev:3000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-angular-cache:/app/.angular
    ports:
      - "4200:4200"
    depends_on:
      - backend-dev

  adminer:
    profiles: [dev]
    image: adminer:latest
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - postgres

  # ── Producción ───────────────────────────────────────────────
  migrate:
    profiles: [prod]
    build:
      context: ./backend
      target: migrate
    environment:
      <<: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  backend:
    profiles: [prod]
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    environment:
      <<: *backend-env
      NODE_ENV: production
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:8080}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  frontend:
    profiles: [prod]
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: http://backend:3000
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  backend-node-modules:
  backend-dist:
  frontend-node-modules:
  frontend-angular-cache:
