<ng-container *transloco="let t">
  <mat-toolbar>
    <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">savings</mat-icon>
    <h1 class="app-title">{{ t('app.name') }}</h1>
    @if (vault.isUnlocked()) {
      <nav class="nav">
        <a mat-button routerLink="/inicio" routerLinkActive="active">{{ t('nav.home') }}</a>
        <a mat-button routerLink="/progreso" routerLinkActive="active">{{ t('nav.progress') }}</a>
        <a mat-button routerLink="/movimientos" routerLinkActive="active">{{ t('nav.transactions') }}</a>
        <a mat-button routerLink="/presupuesto" routerLinkActive="active">{{ t('nav.budget') }}</a>
        <a mat-button routerLink="/recurrentes" routerLinkActive="active">{{ t('nav.recurring') }}</a>
        <a mat-button routerLink="/deudas" routerLinkActive="active">{{ t('nav.debts') }}</a>
        <a mat-button routerLink="/ahorro" routerLinkActive="active">{{ t('nav.savings') }}</a>
        <a mat-button routerLink="/cuentas" routerLinkActive="active">{{ t('nav.accounts') }}</a>
      </nav>
      <span class="spacer"></span>
      <button mat-icon-button (click)="lock()" [attr.aria-label]="t('nav.lock')">
        <mat-icon fontSet="material-symbols-outlined">lock</mat-icon>
      </button>
    }
  </mat-toolbar>
  <main>
    <router-outlet />
  </main>
  <!-- AGPL-3.0, sección 13: quien usa la app por red debe poder obtener su código fuente. -->
  <footer class="footer">
    {{ t('footer.license') }} ·
    <a href="https://github.com/dotforeach/commit" target="_blank" rel="noopener">{{ t('footer.source') }}</a>
  </footer>
</ng-container>
