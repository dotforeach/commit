<ng-container *transloco="let t; prefix: 'changePassphrase'">
  <mat-card class="auth-card" appearance="outlined">
    <mat-card-header>
      <mat-icon mat-card-avatar fontSet="material-symbols-outlined" aria-hidden="true">password</mat-icon>
      <mat-card-title>{{ t('title') }}</mat-card-title>
      <mat-card-subtitle>{{ t('subtitle') }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" class="form" (ngSubmit)="submit()">
        <mat-form-field>
          <mat-label>{{ t('current') }}</mat-label>
          <input matInput type="password" formControlName="current" autocomplete="off" />
        </mat-form-field>
        <mat-form-field>
          <mat-label>{{ t('new') }}</mat-label>
          <input matInput type="password" formControlName="passphrase" autocomplete="off" />
          <mat-hint>{{ t('newHint') }}</mat-hint>
        </mat-form-field>
        <mat-form-field>
          <mat-label>{{ t('confirm') }}</mat-label>
          <input matInput type="password" formControlName="passphraseConfirm" autocomplete="off" />
        </mat-form-field>
        @if (form.hasError('mismatch') && form.controls.passphraseConfirm.touched) {
          <p class="error">{{ t('errors.mismatch') }}</p>
        }
        @if (error(); as key) {
          <p class="error" role="alert">{{ t(key) }}</p>
        }
        <div class="actions">
          <a mat-button routerLink="/inicio">{{ t('cancel') }}</a>
          <button mat-flat-button type="submit" [disabled]="busy() || form.invalid">
            @if (busy()) {
              <mat-spinner diameter="18" />
            }
            {{ t('save') }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</ng-container>
