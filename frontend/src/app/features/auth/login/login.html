<ng-container *transloco="let t; prefix: 'login'">
  <mat-card class="auth-card" appearance="outlined">
    <mat-card-header>
      <mat-card-title>{{ t('title') }}</mat-card-title>
      <mat-card-subtitle>{{ t('subtitle') }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" class="form" (ngSubmit)="submit()">
        <mat-form-field>
          <mat-label>{{ t('email') }}</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="username" />
        </mat-form-field>
        <mat-form-field>
          <mat-label>{{ t('password') }}</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
        </mat-form-field>
        @if (error(); as key) {
          <p class="error" role="alert">{{ t(key) }}</p>
        }
        <div class="actions">
          <button mat-flat-button type="submit" [disabled]="busy() || form.invalid">{{ t('submit') }}</button>
        </div>
      </form>
    </mat-card-content>
    <mat-card-footer class="footer">
      {{ t('noAccount') }} <a routerLink="/registro">{{ t('register') }}</a>
      <br />
      <a routerLink="/" data-testid="back-home">{{ t('backHome') }}</a>
    </mat-card-footer>
  </mat-card>
</ng-container>
