<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Commit</title>
    <base href="/" />
    <script src="theme-init.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Pantalla de carga antes de que arranque Angular (que reemplaza el contenido de app-root) -->
    <style>
      .splash { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 12px; padding: 24px; text-align: center;
        font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; color: #44474e; background: #f9f9ff; }
      .splash strong { font-size: 22px; color: #1a1b1f; }
      .splash p { margin: 0; max-width: 320px; font-size: 14px; line-height: 1.45; }
      .splash .ring { width: 36px; height: 36px; border-radius: 50%; border: 4px solid #e0e2ec; border-top-color: #005cbb; animation: splash-spin .9s linear infinite; }
      .splash .slow { opacity: 0; animation: splash-show 0s 5s forwards; }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      @keyframes splash-show { to { opacity: 1; } }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) .splash { color: #c4c6d0; background: #121316; } html:not([data-theme="light"]) .splash strong { color: #e3e2e6; } html:not([data-theme="light"]) .splash .ring { border-color: #44474e; border-top-color: #abc7ff; } }
      html[data-theme="dark"] .splash { color: #c4c6d0; background: #121316; }
      html[data-theme="dark"] .splash strong { color: #e3e2e6; }
      html[data-theme="dark"] .splash .ring { border-color: #44474e; border-top-color: #abc7ff; }
      @media (prefers-reduced-motion: reduce) { .splash .ring { animation-duration: 3s; } }
    </style>
  </head>
  <body>
    <app-root>
      <div class="splash" role="status" aria-live="polite">
        <div class="ring" aria-hidden="true"></div>
        <strong>🐷 Cargando Commit…</strong>
        <p class="slow">No es un error: si nadie usó Commit en un rato, el servidor tarda unos segundos en despertar.</p>
      </div>
    </app-root>
    <noscript>Commit necesita JavaScript para funcionar. Actívalo en tu navegador.</noscript>
  </body>
</html>
