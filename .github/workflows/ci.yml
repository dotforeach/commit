# CI: se ejecuta en cada pull request y en cada push a main.
# Gate: el despliegue (deploy.yml) solo corre si todo esto pasa.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck, lint, unitarios, e2e)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: commit, POSTGRES_PASSWORD: commit_ci, POSTGRES_DB: commit }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U commit" --health-interval 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://commit:commit_ci@localhost:5432/commit?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-solo-para-tests-no-es-real-0000
      AUTH_RATE_LIMIT: '200'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: backend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: backend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm prisma migrate deploy
      - run: pnpm typecheck
      - run: pnpm lint --max-warnings 0
      - run: pnpm test
      - run: pnpm test:e2e

  frontend:
    name: Frontend (íconos, unitarios, build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --watch=false # incluye la verificación de íconos
      - run: pnpm build --configuration production

  e2e:
    name: E2E en navegador (stack completo)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Entorno de prueba
        run: |
          cp .env.example .env
          echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> .env
      - name: Levantar el stack de desarrollo (con Mailpit)
        run: docker compose --profile dev up -d --build
      - name: Esperar a que responda
        run: |
          for _ in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4200/api/status || true)
            [ "$code" = "200" ] && curl -sf -o /dev/null http://localhost:4200/ && exit 0
            sleep 5
          done
          docker compose --profile dev logs --tail 80 backend-dev frontend-dev
          exit 1
      - uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: frontend/test-results, retention-days: 7 }
