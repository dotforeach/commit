# CD: cuando el CI pasa en main, construye las imágenes (app, migraciones, OCR y respaldo), despliega a staging y,
# con aprobación manual (protección del ambiente "production" en GitHub), a producción.
# Autenticación con Azure por OIDC (sin contraseñas guardadas en GitHub).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    name: Construir y publicar imágenes
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.IMAGE_TAG }}' }
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name ${{ vars.ACR_NAME }}
      - uses: docker/setup-buildx-action@v3
      - name: Publicar backend, migraciones, frontend y OCR
        run: |
          R="${{ vars.ACR_NAME }}.azurecr.io"
          docker buildx build --push --target prod    -t "$R/commit-backend:$IMAGE_TAG"  backend
          docker buildx build --push --target migrate -t "$R/commit-migrate:$IMAGE_TAG"  backend
          docker buildx build --push --target prod    -t "$R/commit-frontend:$IMAGE_TAG" frontend
          docker buildx build --push                  -t "$R/commit-ocr:$IMAGE_TAG"      ocr
          docker buildx build --push                  -t "$R/commit-backup:$IMAGE_TAG"   infra/backup

  staging:
    name: Desplegar a staging
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging-commit.atheneox.com
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.IMAGE_TAG }}' }
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Migraciones, infraestructura y apps
        env:
          RG: rg-commit-staging
          PARAMS: infra/staging.bicepparam
          ACR_NAME: ${{ vars.ACR_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          STATUS_TOKEN: ${{ secrets.STATUS_TOKEN }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: infra/scripts/deploy.sh
      - name: Prueba de humo
        run: infra/scripts/smoke.sh https://staging-commit.atheneox.com https://api-staging-commit.atheneox.com

  production:
    name: Desplegar a producción
    needs: staging
    runs-on: ubuntu-latest
    environment:
      name: production # configurar "Required reviewers" en GitHub para exigir aprobación
      url: https://commit.atheneox.com
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.IMAGE_TAG }}' }
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Migraciones, infraestructura y apps
        env:
          RG: rg-commit-prod
          PARAMS: infra/prod.bicepparam
          ACR_NAME: ${{ vars.ACR_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }} # solo para el respaldo diario
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          STATUS_TOKEN: ${{ secrets.STATUS_TOKEN }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: infra/scripts/deploy.sh
      - name: Prueba de humo
        run: infra/scripts/smoke.sh https://commit.atheneox.com https://api-commit.atheneox.com
